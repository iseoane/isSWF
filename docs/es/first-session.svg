city:0}}.k12{animation:k12 30.2s linear infinite both}@keyframes k13{0%,57.616%{opacity:0;transform:translateY(3px)}58.416%,96%{opacity:1;transform:none}100%{opacity:0}}.k13{animation:k13 30.2s linear infinite both}@keyframes k14{0%,63.576%{opacity:0;transform:translateY(3px)}64.376%,96%{opacity:1;transform:none}100%{opacity:0}}.k14{animation:k14 30.2s linear infinite both}@keyframes k15{0%,66.225%{opacity:0;transform:translateY(3px)}67.025%,96%{opacity:1;transform:none}100%{opacity:0}}.k15{animation:k15 30.2s linear infinite both}@keyframes k16{0%,71.523%{opacity:0;transform:translateY(3px)}72.323%,96%{opacity:1;transform:none}100%{opacity:0}}.k16{animation:k16 30.2s linear infinite both}@keyframes k17{0%,77.483%{opacity:0;transform:translateY(3px)}78.283%,96%{opacity:1;transform:none}100%{opacity:0}}.k17{animation:k17 30.2s linear infinite both}@keyframes k18{0%,80.132%{opacity:0;transform:translateY(3px)}80.932%,96%{opacity:1;transform:none}100%{opacity:0}}.k18{animation:k18 30.2s linear infinite both}@media (prefers-reduced-motion:reduce){.st,.fr{animation:none!important}}</style>
<rect class="bg" x="1" y="1" width="758" height="852" rx="10" stroke-width="2"/>
<path class="bar" d="M2,34 V11 A9,9 0 0 1 11,2 H749 A9,9 0 0 1 758,11 V34z"/>
<circle cx="20" cy="18" r="5" fill="#ff5f56"/><circle cx="38" cy="18" r="5" fill="#ffbd2e"/><circle cx="56" cy="18" r="5" fill="#27c93f"/>
<text class="sim" x="742" y="22" text-anchor="end">SESIÓN SIMULADA · abreviada, no es una grabación</text>
<g class="st k0"><text class="mu b" x="20" y="73">── 1 · Instala ──</text></g>
<g class="st k1"><text class="mu" x="20" y="96">$</text><text x="40" y="96">claude plugin marketplace add /path/to/isswf-release</text></g>
<g class="st k2"><text class="mu" x="20" y="121">$</text><text x="40" y="121">claude plugin install isswf@isswf --scope user</text></g>
<g class="st k3"><text class="mu b" x="20" y="158">── 2 · Configura tu proyecto ──</text></g>
<g class="st k4"><text class="ac b" x="20" y="181">></text><text class="ac" x="40" y="181">/isswf:isswf-setup</text></g>
<g class="st k5"><text class="ok" x="20" y="206">●</text><text x="40" y="206">La configuración inspecciona este repositorio y solo pregunta lo que falta: los</text><text x="40" y="225">modelos y el esfuerzo de cada rol, dónde se registra el trabajo, las comprobaciones</text><text x="40" y="244">y dónde van los worktrees. Guarda las decisiones en el registro de configuración y</text><text x="40" y="263">añade una pequeña entrada de isSWF en AGENTS.md.</text></g>
<g class="st k6"><text class="mu b" x="20" y="300">── 3 · ¿No sabes qué pedir? ──</text></g>
<g class="st k7"><text class="ac b" x="20" y="323">></text><text class="ac" x="40" y="323">/isswf:isswf-howto Quiero un botón para limpiar el filtro en mi página de listado.</text><text class="ac" x="40" y="342">¿Qué debo usar?</text></g>
<g class="st k8"><text class="ok" x="20" y="367">●</text><text x="40" y="367">Construir una funcionalidad hasta una pull request es el flujo por defecto del</text><text x="40" y="386">coordinador (.agents/roles/references/feature-delivery.md). Aquí no inicio trabajo.</text><text x="40" y="405">Envía al coordinador: Añade un botón para limpiar el filtro que restaure la lista</text><text x="40" y="424">completa.</text></g>
<g class="st k9"><text class="mu b" x="20" y="461">── 4 · Haz una primera petición ──</text></g>
<g class="st k10"><text class="ac b" x="20" y="484">></text><text class="ac" x="40" y="484">/isswf:isswf-coordinator Añade un botón para limpiar el filtro que restaure la lista</text><text class="ac" x="40" y="503">completa.</text></g>
<g class="st k11"><text class="ok" x="20" y="528">●</text><text x="40" y="528">He escrito el plan y un brief corto de cada trabajo como archivos Markdown en</text><text x="40" y="547">.isswf/initiatives/I0001/. J001 pasa a un implementador, el agente que cambia el</text><text x="40" y="566">código y lo comprueba, y se ejecuta en segundo plano.</text></g>
<g class="st k12"><text class="mu b" x="20" y="603">── 5 · Revisión y pull request ──</text></g>
<g class="st k13"><text class="ok" x="20" y="626">●</text><text x="40" y="626">J001 está hecho. Un revisor, un agente distinto, comprobó el cambio exacto. He</text><text x="40" y="645">subido la rama de la funcionalidad y abierto la PR #12. La CI, las comprobaciones</text><text x="40" y="664">automáticas, pasó en su último commit. Aún no se ha fusionado nada.</text></g>
<g class="st k14"><text class="mu b" x="20" y="701">── 6 · Tu aprobación ──</text></g>
<g class="st k15"><text class="ok" x="20" y="724">●</text><text x="40" y="724">La PR #12 está lista. Fusionarla en main es decisión tuya. ¿La apruebas?</text></g>
<g class="st k16"><text class="ac b" x="20" y="749">></text><text class="ac" x="40" y="749">Aprobada. Fusiónala.</text></g>
<g class="st k17"><text class="mu b" x="20" y="786">── 7 · Cierra con una retrospectiva ──</text></g>
<g class="st k18"><text class="ok" x="20" y="809">●</text><text x="40" y="809">He fusionado la PR #12 como decidiste. Ahora repaso lo ocurrido con</text><text x="40" y="828">isswf-retrospective y propongo mejoras como borradores. Tú decides cuáles conservar.</text></g>
</svg>
