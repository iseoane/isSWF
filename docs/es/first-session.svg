<svg xmlns="http://www.w3.org/2000/svg" width="760" height="854" viewBox="0 0 760 854" role="img" aria-labelledby="t d" xml:lang="es">
<title id="t">Una primera sesión de isSWF en Claude Code</title>
<desc id="d">Una sesión de terminal simulada y abreviada: instalar el plugin, configurar el proyecto, preguntar a isswf-howto qué usar, enviar al coordinador una primera petición, ver su revisión y su pull request, aprobar la fusión y cerrar con una retrospectiva.</desc>
