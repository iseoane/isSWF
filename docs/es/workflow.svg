<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1260" viewBox="0 0 760 1260" role="img" aria-labelledby="t d" xml:lang="es">
<title id="t">Cómo avanza un encargo en isSWF</title>
<desc id="d">Un encargo pasa de ti al coordinador, opcionalmente por una entrevista, un investigador o un diagnosticador, y luego por un brief preparado, un implementador, un revisor independiente opcional y la entrega, hasta que lo apruebas. Las cajas discontinuas son pasos opcionales.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#6b7a93"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#9b2c2c"/></marker></defs>
<rect x="1" y="1" width="758" height="1258" rx="12" fill="#f5f6f8" stroke="#8e99aa" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<g text-anchor="start"><path d="M380,89 C380,127.8 380,127.8 380,166.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 110,282 110,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 300,282 300,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 650,282 650,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M432.8,227.5 C530,370 530,380 432.8,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M110,397.5 C110,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M300,397.5 C300,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M650,397.5 C650,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,592 C380,639.3 380,639.3 380,686.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,747.5 C380,793.8 380,793.8 380,840" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M294,720 C174,720 174,1040 288,1040" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M466,880 C586,880 586,720 472,720" fill="none" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#al)"/><path d="M380,914 C380,960.3 380,960.3 380,1006.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,1067.5 C380,1104.8 380,1104.8 380,1142" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M284,550 C34,550 34,200 278,200" fill="none" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#al)"/><text x="136" y="328.5" fill="#4b5563" font-size="11" font-weight="600">¿falta claridad?</text><text x="326" y="328.5" fill="#4b5563" font-size="11" font-weight="600">¿falta un dato?</text><text x="676" y="328.5" fill="#4b5563" font-size="11" font-weight="600">¿fallo raro?</text><text x="498" y="379" text-anchor="end" fill="#4b5563" font-size="11" font-weight="600">todo claro</text><text x="62" y="888" fill="#4b5563" font-size="11" font-weight="600">sin revisión</text><text x="566" y="804" fill="#9b2c2c" font-size="11" font-weight="600">corregir</text><text x="388" y="964.3" fill="#4b5563" font-size="11" font-weight="600">todo bien</text><text x="20" y="520" fill="#9b2c2c" font-size="11" font-weight="600">cambia el plan</text></g>
<g text-anchor="middle">
<rect x="294" y="21" width="172" height="68" rx="8" fill="#ffffff" stroke="#8a5a0b" stroke-width="2"/><text x="380" y="45" font-size="14" font-weight="700" fill="#1b2230">Tú pides algo</text><text x="380" y="63" font-size="11" fill="#4b5563">una mejora, un fallo,</text><text x="380" y="76" font-size="11" fill="#4b5563">docs…</text>
<rect x="284" y="172.5" width="192" height="55" rx="18" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><text x="380" y="196.5" font-size="14" font-weight="700" fill="#1b2230">Coordinador</text><text x="380" y="214.5" font-size="11" fill="#4b5563">organiza y reparte</text>
<rect x="24" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="110" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Entrevista contigo</text><text x="110" y="384.5" font-size="11" fill="#4b5563">solo si hay huecos</text>
<rect x="214" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="300" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Investigador</text><text x="300" y="384.5" font-size="11" fill="#4b5563">solo mira, no toca</text>
<rect x="564" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="650" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Diagnosticador</text><text x="650" y="384.5" font-size="11" fill="#4b5563">para fallos difíciles</text>
<rect x="284" y="508" width="192" height="84" rx="18" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><text x="380" y="532" font-size="14" font-weight="700" fill="#1b2230">Coordinador prepara el</text><text x="380" y="548" font-size="14" font-weight="700" fill="#1b2230">brief</text><text x="380" y="566" font-size="11" fill="#4b5563">qué, cómo se comprueba, con</text><text x="380" y="579" font-size="11" fill="#4b5563">qué guías</text>
<rect x="294" y="692.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="380" y="716.5" font-size="14" font-weight="700" fill="#1b2230">Implementador</text><text x="380" y="734.5" font-size="11" fill="#4b5563">hace el cambio</text>
<rect x="294" y="846" width="172" height="68" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="380" y="870" font-size="14" font-weight="700" fill="#1b2230">Revisor</text><text x="380" y="888" font-size="11" fill="#4b5563">independiente, si el</text><text x="380" y="901" font-size="11" fill="#4b5563">riesgo lo pide</text>
<rect x="294" y="1012.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="380" y="1036.5" font-size="14" font-weight="700" fill="#1b2230">Entrega</text><text x="380" y="1054.5" font-size="11" fill="#4b5563">prepara la propuesta</text>
<rect x="294" y="1148" width="172" height="84" rx="8" fill="#ffffff" stroke="#8a5a0b" stroke-width="2"/><text x="380" y="1172" font-size="14" font-weight="700" fill="#1b2230">Tú das el visto</text><text x="380" y="1188" font-size="14" font-weight="700" fill="#1b2230">bueno</text><text x="380" y="1206" font-size="11" fill="#4b5563">y luego, repaso de lo</text><text x="380" y="1219" font-size="11" fill="#4b5563">aprendido</text>
</g>
</g>
</svg>
