<svg xmlns="http://www.w3.org/2000/svg" width="640" height="378" viewBox="0 0 640 378" role="img" aria-labelledby="t d" xml:lang="en">
<title id="t">The initiatives panel following one job</title>
<desc id="d">A simulated view of the Claude Code initiatives panel with demo data. One job goes from pending to in progress, to in review, to completed.</desc>
<style>
