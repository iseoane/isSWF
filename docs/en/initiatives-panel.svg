.card{stroke:#34465a}.pill.ok{stroke:#4ade80}.pill.run{stroke:#7d8da1}}
@keyframes p0{0%{opacity:1}20%{opacity:1}21.429%,100%{opacity:0}}.f0{animation:p0 21s linear infinite both}@keyframes p1{0%,21.429%{opacity:0}22.857%{opacity:1}41.429%{opacity:1}42.857%,100%{opacity:0}}.f1{animation:p1 21s linear infinite both}@keyframes p2{0%,42.857%{opacity:0}44.286%{opacity:1}62.857%{opacity:1}64.286%,100%{opacity:0}}.f2{animation:p2 21s linear infinite both}@keyframes p3{0%,64.286%{opacity:0}65.714%{opacity:1}98.571%{opacity:1}100%,100%{opacity:0}}.f3{animation:p3 21s linear infinite both}@media (prefers-reduced-motion:reduce){.st,.fr{animation:none!important}.fr{opacity:0}.fr.last{opacity:1}}</style>
