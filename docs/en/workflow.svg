<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1260" viewBox="0 0 760 1260" role="img" aria-labelledby="t d" xml:lang="en">
<title id="t">How a request moves through isSWF</title>
<desc id="d">A request goes from you to the coordinator, optionally through an interview, a researcher or a diagnostician, then to a prepared brief, a worker, an optional independent reviewer and delivery, until you approve it. Dashed boxes are optional steps.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#6b7a93"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#9b2c2c"/></marker></defs>
<rect x="1" y="1" width="758" height="1258" rx="12" fill="#f5f6f8" stroke="#8e99aa" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<g text-anchor="start"><path d="M380,97 C380,131.8 380,131.8 380,166.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 110,282 110,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 300,282 300,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,227.5 C380,282 650,282 650,336.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M432.8,227.5 C530,370 530,380 432.8,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M110,397.5 C110,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M300,397.5 C300,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M650,397.5 C650,449.8 380,449.8 380,502" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,592 C380,639.3 380,639.3 380,686.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,747.5 C380,793.8 380,793.8 380,840" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M294,720 C174,720 174,1040 288,1040" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M466,880 C586,880 586,720 472,720" fill="none" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#al)"/><path d="M380,914 C380,960.3 380,960.3 380,1006.5" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M380,1067.5 C380,1108.8 380,1108.8 380,1150" fill="none" stroke="#6b7a93" stroke-width="2" marker-end="url(#a)"/><path d="M284,550 C34,550 34,200 278,200" fill="none" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#al)"/><text x="136" y="328.5" fill="#4b5563" font-size="11" font-weight="600">unclear?</text><text x="326" y="328.5" fill="#4b5563" font-size="11" font-weight="600">fact missing?</text><text x="676" y="328.5" fill="#4b5563" font-size="11" font-weight="600">odd bug?</text><text x="498" y="379" text-anchor="end" fill="#4b5563" font-size="11" font-weight="600">all clear</text><text x="62" y="888" fill="#4b5563" font-size="11" font-weight="600">no review needed</text><text x="556" y="804" fill="#9b2c2c" font-size="11" font-weight="600">fix</text><text x="388" y="964.3" fill="#4b5563" font-size="11" font-weight="600">all good</text><text x="20" y="520" fill="#9b2c2c" font-size="11" font-weight="600">plan changes</text></g>
<g text-anchor="middle">
<rect x="294" y="13" width="172" height="84" rx="8" fill="#ffffff" stroke="#8a5a0b" stroke-width="2"/><text x="380" y="37" font-size="14" font-weight="700" fill="#1b2230">You ask for</text><text x="380" y="53" font-size="14" font-weight="700" fill="#1b2230">something</text><text x="380" y="71" font-size="11" fill="#4b5563">an improvement, a bug,</text><text x="380" y="84" font-size="11" fill="#4b5563">docs…</text>
<rect x="284" y="172.5" width="192" height="55" rx="18" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><text x="380" y="196.5" font-size="14" font-weight="700" fill="#1b2230">Coordinator</text><text x="380" y="214.5" font-size="11" fill="#4b5563">organizes and hands out work</text>
<rect x="24" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="110" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Interview with you</text><text x="110" y="384.5" font-size="11" fill="#4b5563">only if there are gaps</text>
<rect x="214" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="300" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Researcher</text><text x="300" y="384.5" font-size="11" fill="#4b5563">only looks, never edits</text>
<rect x="564" y="342.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="650" y="366.5" font-size="14" font-weight="700" fill="#1b2230">Diagnostician</text><text x="650" y="384.5" font-size="11" fill="#4b5563">for hard bugs</text>
<rect x="284" y="508" width="192" height="84" rx="18" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/><text x="380" y="532" font-size="14" font-weight="700" fill="#1b2230">Coordinator prepares</text><text x="380" y="548" font-size="14" font-weight="700" fill="#1b2230">the brief</text><text x="380" y="566" font-size="11" fill="#4b5563">what, how to check it, which</text><text x="380" y="579" font-size="11" fill="#4b5563">guides</text>
<rect x="294" y="692.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="380" y="716.5" font-size="14" font-weight="700" fill="#1b2230">Worker</text><text x="380" y="734.5" font-size="11" fill="#4b5563">makes the change</text>
<rect x="294" y="846" width="172" height="68" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2" stroke-dasharray="6 4"/><text x="380" y="870" font-size="14" font-weight="700" fill="#1b2230">Reviewer</text><text x="380" y="888" font-size="11" fill="#4b5563">independent, when the</text><text x="380" y="901" font-size="11" fill="#4b5563">risk calls for it</text>
<rect x="294" y="1012.5" width="172" height="55" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><text x="380" y="1036.5" font-size="14" font-weight="700" fill="#1b2230">Delivery</text><text x="380" y="1054.5" font-size="11" fill="#4b5563">prepares the proposal</text>
<rect x="294" y="1156" width="172" height="68" rx="8" fill="#ffffff" stroke="#8a5a0b" stroke-width="2"/><text x="380" y="1180" font-size="14" font-weight="700" fill="#1b2230">You approve</text><text x="380" y="1198" font-size="11" fill="#4b5563">then a look back at what</text><text x="380" y="1211" font-size="11" fill="#4b5563">was learned</text>
</g>
</g>
</svg>
