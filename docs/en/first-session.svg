<path class="bar" d="M2,34 V11 A9,9 0 0 1 11,2 H749 A9,9 0 0 1 758,11 V34z"/>
<circle cx="20" cy="18" r="5" fill="#ff5f56"/><circle cx="38" cy="18" r="5" fill="#ffbd2e"/><circle cx="56" cy="18" r="5" fill="#27c93f"/>
<text class="sim" x="742" y="22" text-anchor="end">SIMULATED SESSION · shortened, not a recording</text>
<g class="st k0"><text class="mu b" x="20" y="73">── 1 · Install ──</text></g>
<g class="st k1"><text class="mu" x="20" y="96">$</text><text x="40" y="96">claude plugin marketplace add /path/to/isswf-release</text></g>
<g class="st k2"><text class="mu" x="20" y="121">$</text><text x="40" y="121">claude plugin install isswf@isswf --scope user</text></g>
<g class="st k3"><text class="mu b" x="20" y="158">── 2 · Set up your project ──</text></g>
<g class="st k4"><text class="ac b" x="20" y="181">></text><text class="ac" x="40" y="181">/isswf:isswf-setup</text></g>
<g class="st k5"><text class="ok" x="20" y="206">●</text><text x="40" y="206">Setup inspects this repository and asks only what is missing: the models and effort</text><text x="40" y="225">for each role, where the work is tracked, the checks, and where worktrees go. It</text><text x="40" y="244">saves the choices in the setup record and adds a small isSWF entry to AGENTS.md.</text></g>
<g class="st k6"><text class="mu b" x="20" y="281">── 3 · Not sure what to ask? ──</text></g>
<g class="st k7"><text class="ac b" x="20" y="304">></text><text class="ac" x="40" y="304">/isswf:isswf-howto I want a clear-filter button on my list page. What should I use?</text></g>
<g class="st k8"><text class="ok" x="20" y="329">●</text><text x="40" y="329">Building a feature through to a pull request is the coordinator's default flow</text><text x="40" y="348">(.agents/roles/references/feature-delivery.md). I do not start work here. Send the</text><text x="40" y="367">coordinator: Add a clear-filter button that restores the full list.</text></g>
<g class="st k9"><text class="mu b" x="20" y="404">── 4 · Make a first request ──</text></g>
<g class="st k10"><text class="ac b" x="20" y="427">></text><text class="ac" x="40" y="427">/isswf:isswf-coordinator Add a clear-filter button that restores the full list.</text></g>
<g class="st k11"><text class="ok" x="20" y="452">●</text><text x="40" y="452">I wrote the plan and a short brief for each job as Markdown files under</text><text x="40" y="471">.isswf/initiatives/I0001/. J001 goes to a worker, the agent that changes the code</text><text x="40" y="490">and checks it, and it runs in the background.</text></g>
<g class="st k12"><text class="mu b" x="20" y="527">── 5 · Review and pull request ──</text></g>
<g class="st k13"><text class="ok" x="20" y="550">●</text><text x="40" y="550">J001 is done. A reviewer, a separate agent, checked the exact change. I pushed the</text><text x="40" y="569">feature branch and opened PR #12. CI, the automatic checks, passed on its head.</text><text x="40" y="588">Nothing is merged yet.</text></g>
<g class="st k14"><text class="mu b" x="20" y="625">── 6 · Your approval ──</text></g>
<g class="st k15"><text class="ok" x="20" y="648">●</text><text x="40" y="648">PR #12 is ready. Merging it into main is your decision. Do you approve?</text></g>
<g class="st k16"><text class="ac b" x="20" y="673">></text><text class="ac" x="40" y="673">Approved. Merge it.</text></g>
<g class="st k17"><text class="mu b" x="20" y="710">── 7 · Close with a retrospective ──</text></g>
<g class="st k18"><text class="ok" x="20" y="733">●</text><text x="40" y="733">Merged PR #12 as you decided. Now I look back at what happened with</text><text x="40" y="752">isswf-retrospective and propose improvements as drafts. You decide which to keep.</text></g>
</svg>
