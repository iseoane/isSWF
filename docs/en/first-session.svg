<title id="t">A first isSWF session in Claude Code</title>
<desc id="d">A simulated terminal session, shortened: install the plugin, set up the project, ask isswf-howto what to use, send the coordinator a first request, see its review and pull request, approve the merge and close with a retrospective.</desc>
