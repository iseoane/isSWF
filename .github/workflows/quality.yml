name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Require Linux sandbox capability
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: node tools/check-quality.mjs
        env:
          ISSWF_TEST_BUN: bun
          ISSWF_TEST_BUN_WORKER: '1'
      - name: Install locked local analysis tools
        run: npm ci --prefix tooling/quality --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: node tooling/quality/node_modules/eslint/bin/eslint.js --config tooling/quality/eslint.config.mjs tools tests tooling/quality/*.mjs
      - name: Dead code
        run: node tooling/quality/node_modules/knip/bin/knip.js --config tooling/quality/knip.json --no-progress
