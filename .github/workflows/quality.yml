name: Quality

on:
  pull_request:
  push:
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Install Linux sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor
      - name: Allow Bubblewrap user namespaces on the ephemeral runner
        run: |
          sudo tee /etc/apparmor.d/isswf-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/isswf-ci-bwrap
      - name: Require Linux sandbox capability
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - run: node tools/check-quality.mjs
        env:
          ISSWF_TEST_BUN: bun
          ISSWF_TEST_BUN_WORKER: '1'
      - name: Install locked local analysis tools
        run: npm ci --prefix tooling/quality --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: node tooling/quality/node_modules/eslint/bin/eslint.js --config tooling/quality/eslint.config.mjs tools tests tooling/quality/*.mjs
      - name: Dead code
        run: node tooling/quality/node_modules/knip/bin/knip.js --config tooling/quality/knip.json --no-progress

  platforms:
    name: Package and host discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Verify checkout byte policy and external plan grant boundaries
        run: |
          node tests/checkout-line-endings.mjs .
          node tests/plan-grant-boundary.mjs .
          node tests/plan-publication.mjs .
          node tests/factory-tools-install.mjs .
          node tests/initiative-plan.mjs .
          node tests/worker-route-admission.mjs .
          node tests/host-portability.mjs .
      - name: Verify initialization and process identity on the native platform
        run: node tests/init-platform.mjs .
      - name: Build and install native package; test CLI, resources and worktrees
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/platform-package.mjs .
      - name: Verify native Windows LPAC command controls
        if: runner.os == 'Windows'
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/windows-tool-sandbox.mjs
      - name: Verify native Windows owner loss and startup refusal
        if: runner.os == 'Windows'
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/windows-sandbox-lifetime.mjs
      - name: Verify compiled Windows worker task with a synthetic SDK
        if: runner.os == 'Windows'
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/windows-worker-task.mjs
      - name: Verify native Windows worker identity
        if: runner.os == 'Windows'
        run: node tests/windows-worker-identity.mjs
      - name: Verify native Windows trusted task containment
        if: runner.os == 'Windows'
        run: node tests/windows-worker-host.mjs
      - name: Verify native Windows detached lifecycle
        if: runner.os == 'Windows'
        run: node tests/windows-worker-lifecycle.mjs
      - name: Verify compiled Windows worker recovery and capacity
        if: runner.os == 'Windows'
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/windows-worker-recovery.mjs
      - name: Install locked host test dependencies without lifecycle scripts
        run: npm ci --prefix tooling/host-tests --ignore-scripts --no-audit --no-fund
      - name: Install and discover skills with real Pi and Claude hosts, without models
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/host-discovery.mjs .
      - name: Verify source-checkout isolation without changing user installations
        env:
          ISSWF_PLATFORM_ROOT: ${{ runner.temp }}/isswf-platform
        run: node tests/source-host-isolation.mjs .
      - name: Retain platform and discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/isswf-platform/platform-report.json
            ${{ runner.temp }}/isswf-platform/host-report.json
            ${{ runner.temp }}/isswf-platform/claude-inventory.txt
            ${{ runner.temp }}/isswf-platform/source-isolation-report.json
          if-no-files-found: warn
          retention-days: 14
